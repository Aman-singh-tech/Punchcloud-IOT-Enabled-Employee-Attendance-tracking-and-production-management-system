services:
  postgres:
    image: postgres:16-alpine
    container_name: punchcloud-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: punchcloud
      POSTGRES_PASSWORD: punchcloud
      POSTGRES_DB: punchcloud
    ports:
      - "5432:5432"
    volumes:
      - punchcloud_pg_data:/var/lib/postgresql/data

volumes:
  punchcloud_pg_data:
